name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Banco do serviço PostgreSQL abaixo (descartável). Os testes criam e usam bancos terminados em _test.
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  TEST_DB_NAME: azteca_test

jobs:
  backend:
    name: Backend (testes + auditoria)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Criar schema no banco de teste
        run: npm run db:teste
      - name: Testes (API, schema, armazenamento, busca/filtros, concorrência)
        run: npm test
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (build + auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E no navegador (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Dependências do backend
        run: npm ci
        working-directory: backend
      - name: Dependências do frontend
        run: npm ci
        working-directory: frontend
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Testes E2E
        run: npx playwright test
        working-directory: frontend
        env:
          CI: 'true'
      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
